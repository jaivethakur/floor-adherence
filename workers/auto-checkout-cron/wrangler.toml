name = "catchabit-time-auto-checkout"
main = "src/index.js"
compatibility_date = "2026-01-01"

# Cron Trigger: fires daily at 8:00 PM IST (14:30 UTC)
[triggers]
crons = ["30 14 * * *"]

# Cloudflare D1 Database Binding (shares catchabit-time-db)
[[d1_databases]]
binding = "DB"
database_name = "catchabit-time-db"
database_id = "c83b9ae8-e606-4422-9a2c-b8e5826bac68"
