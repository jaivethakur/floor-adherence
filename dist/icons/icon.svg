<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- App Background with subtle rounded squircle -->
  <rect width="512" height="512" rx="115" fill="url(#grad)"/>
  
  <!-- Subtle inner background card -->
  <circle cx="256" cy="256" r="185" fill="#0f172a" fill-opacity="0.55" filter="url(#shadow)"/>
  
  <!-- Outer Floor Target Progress Ring (accentuating 7h daily floor target) -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="#334155" stroke-width="16" stroke-linecap="round"/>
  <circle cx="256" cy="256" r="150" fill="none" stroke="url(#ringGrad)" stroke-width="16" stroke-linecap="round" stroke-dasharray="942" stroke-dashoffset="235"/>
  
  <!-- Modern Clock Hands (pointing to 8:00 floor target) -->
  <!-- Hour hand -->
  <line x1="256" y1="256" x2="175" y2="300" stroke="#f8fafc" stroke-width="18" stroke-linecap="round"/>
  <!-- Minute hand -->
  <line x1="256" y1="256" x2="256" y2="140" stroke="#38bdf8" stroke-width="14" stroke-linecap="round"/>
  
  <!-- Center Pin with neon accent -->
  <circle cx="256" cy="256" r="18" fill="#f8fafc"/>
  <circle cx="256" cy="256" r="8" fill="#4f46e5"/>
  
  <!-- Target achievement spark -->
  <circle cx="256" cy="106" r="10" fill="#10b981"/>
</svg>
