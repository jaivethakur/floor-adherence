name: Build Android APK & Release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        run: npm ci

      - name: Build Web App
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Rename and Prepare APK
        run: |
          mkdir -p release-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk release-apk/FloorAdherence.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FloorAdherence-APK
          path: release-apk/FloorAdherence.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: Floor Adherence Android App (v1.0.0-${{ github.run_number }})
          body: |
            ## Floor Adherence Android APK Release 🎉
            
            ### Included Features:
            - **Native Android Home Screen Widget** (2x1, 3x2, 4x2 resizable)
            - **1-Tap Quick Actions**: Check In, Break, Check Out, WFH right from your phone's home screen
            - **Background Cloudflare API Sync**: Widget updates immediately without opening the app
            - **Zero-Impact WFH Math**: Protects monthly floor adherence average
            - **Glassmorphism Dark UI**: Modern dark frosted glass styling
            
            ### How to Install:
            1. Download `FloorAdherence.apk` below directly to your phone.
            2. Tap the downloaded file to install (allow "Install Unknown Apps" if prompted).
            3. Log in with your Floor Adherence account.
            4. Long-press your phone's home screen -> **Widgets** -> select **Floor Adherence**!
          files: release-apk/FloorAdherence.apk
